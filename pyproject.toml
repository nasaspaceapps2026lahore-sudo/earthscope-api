[project]
name = "nasa2026"
version = "0.1.0"
description = "EarthScope API: NASA Space Apps 2026, Be an Earth System Trend Detective"
readme = "README.md"
authors = [
    { name = "=", email = "eeee@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "h5netcdf>=1.8.2",
    "h5py>=3.16.0",
    "netcdf4>=1.7.5.1.post1",
    "numpy>=2.5.4",
    "pandas>=2.2",
    "xarray>=2026.9.0",
]

[project.scripts]
nasa2026 = "nasa2026:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
